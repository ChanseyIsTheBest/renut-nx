[functions]
# banjo-nx optimised codegen: functions that read a condition register their caller set (tools/read_before_write.py on
# the generated code, 2026-10-07). With cr_as_local each function's CR fields start at zero, so these must share the
# caller's registers (masseffect-nx's mechanism). Expected residue of the checker, harmless: sub_821E5D00, sub_821EEC08,
# sub_82233D80, sub_8226E228 (mfcr right after an fcmpu, only cr6's bits used); sub_82572010 (jump-table cases past
# the real table end, never taken).
#   sub_825C1670: split fragment that starts with `bne cr6` on its caller's compare.
# non_volatile_as_local (2026-10-07; tools/read_before_write.py, which now also ends a path at ppc_longjmp): functions
# that read a non-volatile register their parent set up. A report is a fragment when the function's own prologue does
# not save the register (no frame, or a frame without that save); one whose prologue saves it owns it, and its early
# read is an infeasible path or a dead value (26 such, all with full frames: 25 in the 0x828xxxxx library cluster
# sub_8283CE58..sub_828FB408, and sub_823854C8). Also residue, harmless: sub_82572010 (cases past the real table end,
# as above); sub_82BCBFE4 and 490 others whose first 4-8 bytes are data words (`lwz r21,-26904(r27)` is 0x82BB96E8)
# in front of a normal function: their loads are dead and the r16/r21 they would have clobbered stay intact; the
# setjmp callers' `env.rN = rN` copies (a zero-initialised local copied, harmless).
#   SEH __finally funclets called with bl from their owner (they take its frame from r12 or read its r31, use its
#   live r27-r31 and may reload them). The CRT ones are named in config/renut_funcs.toml; an entry here replaces that
#   one (config.cpp insert_or_assign), so it repeats the name. Found once the checker read named functions too
#   (rex_LN15_18, the __finally of _mtinitlocknum, crashed the first boot). A funclet also saves the registers it reads,
#   so "the prologue saves it" alone does not prove a function owns a register: the 26 above have the standard
#   prologue (mflr r12; bl __savegprlr_N) and take no frame from r12. Residue, harmless: rex_XMemCpyStreaming*_Helper
#   (xor r30,r30,r30), rex_setjmp (its body is never run: every guest setjmp call is ppc_setjmp).
#   Fragments without a frame of their own, reached by a tail jump or a jump table of their parent:
# banjo-nx (2026-10-29, title update 3): the entries derived again on the TU's code (tu_v3/make_tu_config.py):
# the CRT's SEH __finally funclets (frame from r12, reading the saved r27-r31 of their owner) and the two
# lock funclets; the base's fragments have no TU counterpart that reads its parent's registers.
