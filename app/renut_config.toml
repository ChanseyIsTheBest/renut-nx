# NOTE: config/renut_crt.toml is deliberately NOT included. Adding it swaps the
# guest heap (RtlAllocateHeap/RtlFreeHeap/...) and the guest CRT over to the
# SDK's native rexcrt implementations -- the codegen *strips* the original PPC
# code for every mapped address. That is a large runtime behaviour change, not a
# naming tweak. Enable it deliberately, one group at a time, and test:
# "config/renut_crt.toml"

# banjo-nx optimised codegen (from sa2-nx's codegen_flavor.toml; masseffect-nx measured the set on the console). The
# options only change how the C++ is written, so the compiler keeps guest state in host registers and drops dead stores;
# the guest-visible result is the same:
#   - cr0-cr7, ctr, xer and the lwarx reservation as C++ locals;
#   - skip_msr: no mfmsr/mtmsrd fences, ctx.msr stores or global lock around guest atomic sequences (a stwcx. is
#     already a compare-and-swap);
#   - dform_disp_split: D-form loads/stores as base + zext(reg) + disp (differs only when reg + disp crosses 2^32, a
#     guest fault either way);
#   - fctiwz_inline: fctiwz as fcvtzs + NaN select.
# Left out (needs per-function audits): args_in_registers. non_volatile_as_local, elide_lr_stores and
# non_argument_as_local (2026-10-15): below.
# Post-codegen steps (tools/post_codegen.py, run by the build after every codegen): guest memory without volatile
# (masseffect-nx: +15-20 % fps) with loop barriers, and direct calls between unhooked functions.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
# From sa2-nx's second CPU round (2026-10-12; banjo-nx/sdk: rex/ppc/diet_ops.h, builders/floating_point.cpp): fctid,
# fctiw and fctidz as helpers. A CORRECTION for the Switch as much as a speed-up: without it the AArch64 build converted
# through simde's portable path, C round(), which rounds halves AWAY from zero (0.5 -> 1, 2.5 -> 3), where the Xbox 360
# and the PC build round to even (0, 2). Banjo has 425 fctid sites (most followed by fcfid: "round to integer").
# frinti + fcvtzs round as the 360 does. On x86 the result is unchanged except at exactly 2^63 (INT64_MAX as on the
# 360; cvtsd2si gave INT64_MIN).
fcti_inline = true
# sa2-nx's three CPU rounds of 2026-10-12 (its docs/cpu-rounds.md; console result there: its 1.0.1 against 1.0.0 "better by
# about 15 %" with a new PGO profile and a link setting in the same build). Generator options, all copied into
# banjo-nx/sdk with sa2-nx's unit tests (sdk/tests, tools/run_sdk_tests.ps1):
#   - fp_compares_modeless (from sasrt-nx): fcfid, fctiwz, fctidz and fsel cannot be changed by the flush mode, so they
#     switch nothing; fcmpu / fcmpo / frsp go through any-mode helpers while VMX mode is current.
#   - fp_mode_lookahead (from sasrt-nx): before a scalar float instruction switches the mode, the generator looks at the
#     next instruction that needs one: lfs / stfs / frsp / fcmpu and one or two fadds / fsubs / fmuls / fdivs in front
#     of vector code compute in whatever mode is current (rex::ppc::*AnyMode: the bits the plain expression gives with
#     the mode off). fp_mode_lookahead_past_branch (sasrt-nx's rule; sa2-nx added the key to turn it off): the any-mode
#     form is also used on a bet, when nothing that needs a mode follows before the next branch. In SA2 (scalar float
#     code) it ran 94,000 tests a frame to save nine switches and is off there. Banjo's switches come from maths
#     functions that alternate scalar and vector arithmetic (sub_8294EF68, sub_823B59C0, sub_823B4C78, sub_82CE9250),
#     the case the rule was made for. PC census of 2026-10-13 (banjo_diag_runtime_census, Spiral Mountain): without the
#     bet 868,000 switches a second, with it 540,000 (-38 %), for 3.8 million more helper tests a second (11.5 per
#     switch saved; SA2: 235), and 12,807 flush-mode checks left in the code instead of 17,947. On: break-even is an
#     `msr fpcr` of about 40 cycles if every test were extra work, less where a test replaces a mode check. The
#     console's profiler log measures that cost ("FPCR on this CPU"); set false and rebuild if it says otherwise.
#   - fp_copy_pairs: lfs then stfs of the same register (structure and matrix copies) writes the loaded bits without
#     a mode, where VMX mode is known to be current.
#   - div_inline: divw / divwu / divd / divdu through rex::ppc helpers (AArch64: sdiv / udiv define a zero divisor and
#     INT_MIN / -1, so the C guards go; x86: the expression as before).
# Not set, as in sa2-nx: rotate_word_narrow (no gain with the Switch compiler), fp_copy_only_functions (lost in its
# census).
# The post-codegen locals (tools/loop_locals.py, tools/leaf_locals.py) skip the functions of app/config/locals_optout.txt
# (2026-10-16, marathon-nx proposal 3: 207 loop and 89 leaf functions whose A57 code is cheaper without them, measured
# by tools/locals_choice.py). The tools never undo a function they converted, so a new list needs a fresh codegen: edit
# this comment (the build re-runs the generator when this file changes). List revision 3 (2026-10-19: two of the
# four hottest opted-out functions taken back off it, measured on the A57 code; config/locals_optout.txt).
# dcbt_prefetch (2026-10-16, proposed by marathon-nx, which emits its 276 always): the game's 1,785 dcbt / dcbtst hints
# as the host's prefetch of the same address (REX_PREFETCH in the pch). PRFM never faults and changes no value; the
# A57's hardware prefetcher may already cover the sequential ones. CMake BANJO_GEN_DCBT_PREFETCH=OFF compiles them to
# nothing again.
# 2026-10-16 (CPU codegen agent): the generator read dcbt's operands as {RA, RB}, but they decode as {CT, RA, RB}: every
# prefetch went to RA alone (or r0, often the null page) instead of RA + RB, 1.85 % of the console's game-thread samples
# on prefetches of the wrong address. Fixed in sdk/src/codegen/builders/system.cpp (emit_prefetch).
dcbt_prefetch = true
# rotate_word_shifts (2026-10-16, CPU codegen agent): rlwinm / rlwimi with a mask that does not wrap as the shift,
# extract or 32-bit rotate the mask makes of them (lsl / lsr / ubfiz / ubfx on AArch64: one instruction where the 64-bit
# rotate of the duplicated word took two or three). Measured on 12 files: -0.59 % instructions, -0.54 % weighted by the
# console's samples. Exact: sdk/tests/rotate_word_test.cpp, every shift and mask.
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
# banjo-nx (2026-10-19, CPU proposal 15; sdk: codegen config fp_copy_forwarding): the copy forms in any mode and through
# in-place fneg / fabs / fnabs and instructions that write other registers (the culling loop's lfs, fneg, stfs paid two
# range checks and two conversions); an lfs takes the form whenever one of its stores does.
fp_copy_forwarding = true
div_inline = true
# sa2-nx round 7 (sdk: codegen config fp_moves_modeless, rex/ppc/diet_ops.h): floating-point moves (lfd/stfd forms,
# stfiwx, fmr, fabs, fnabs, fneg) switch no host flush mode, and in VMX mode lfs/stfs convert with mode-independent
# helpers (only a denormal single or 0 < |d| < 2^-126 takes a cold path with the mode cleared). Each switch is an
# `msr fpcr` on the Switch, very slow on the A57 (SA2's VMX-heavy thread: 20-26 % of its samples right after one;
# Banjo's ELF had 40,120 of them). Unit-tested exact in both modes by sa2-nx.
fp_moves_modeless = true
# The other ports' measured "diet" (sa2-nx round 7, SASRT, masseffect-nx: -10 % main thread): r14-r31, f14-f31 and
# v14-v31/v64-v127 as C++ locals (the __savegprlr/__restgprlr helpers and the guest-stack traffic for those registers
# disappear) and no `ctx.lr = <return address>` store before every call. Audited for Banjo (2026-10-07):
#   - setjmp/longjmp (10 guest functions call setjmp): banjo-nx/sdk's codegen now copies every C++-local register into
#     env at a setjmp and back after a longjmp (function_graph.cpp, builders/context.cpp), so the setjmp caller gets
#     its setjmp-time registers as on the console; before, a local changed between setjmp and longjmp was
#     indeterminate (also true of the CR locals above).
#   - ctx.lr readers: only diagnostics (banjo_pool_lock's log line, the console profilers' caller attribution); the
#     guest unwinder (RtlUnwind, RtlRaiseException) is not implemented by the runtime, so the guest stack's saved return
#     addresses are never read back.
#   - Hooks: mid-asm hooks take the locals by reference; no built hook reads ctx.r14-r31/f14-f31/v14+ (the hand-copied
#     functions of src/renut_engine/fixes/mullhwucrash.cpp do, and are not built).
#   - Functions that read a non-volatile their parent set up: tools/read_before_write.py after the codegen ([functions]).
non_volatile_as_local = true
elide_lr_stores = true
# Registers this game uses outside the PPC ABI stay in ctx in every function (banjo-nx/sdk codegen key, 2026-10-07;
# found by tools/read_before_write.py once it read vector registers at all: it used to drop every simde_mm_store line):
#   - v64-v77: VMX128 constants built once by sub_8239CE88 (called from gameMain) and read, never written, by ~900
#     functions (Rare's math, scene scripts, avatars). sub_82372C68 rewrites one lane of v69 for good, as on the
#     console. Microsoft's WMV decoder also hands its asm routines permute masks in v64/v65 (g_InterpolateBlock_*_Xenon
#     start with vor128 v30,v64,v64): with them as zeroed locals every FMV was garbage. No function saves v64-v77
#     with a __savevmx_64..77 helper.
#   - v92: an implicit argument. sub_82BD9408 / sub_82BDAED0 / sub_82BDD080 set it and call sub_82BD8D68, whose
#     callees sub_82BD59F8 / sub_82BD5CE0 / sub_82BD6120 read it (vmsum4fp128 ... v92).
non_volatile_as_local_keep = ["v64-v77", "v92"]
